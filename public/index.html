<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Base -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>Chinook Analytics Dashboard</title>
    <meta name="description" content="Dashboard interactivo de la base de datos pública chinook usando SQL y Express.js" />
    <meta name="keywords" content="Dashboard, express, sqlite, full stack" />
    <meta name="author" content="Ramiro Graca" />

    <!-- Open Graph (preview para redes) -->
    <meta property="og:title" content="Dashboard" />
    <meta property="og:description" content="Dashboard moderno con backend real y base de datos." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_ES" />

    <!-- Theme -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="color-scheme" content="light dark" />

    <!-- Icons / Favicons -->
    <!-- <link rel="icon" href="./assets/icons/favicon.ico" />
    <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png" /> -->

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <!-- CSS -->
    <link rel="stylesheet" href="/styles/globals.css" />
    <link rel="stylesheet" href="/css/main.css" />


</head>
<body>
    <!-- <canvas id="myChart" style="width:100%;max-width:700px"></canvas> -->
    <!-- <button id="load">Load top tracks</button> -->
  <div class="app">
    <header class="header">
        <div class="title">
            <img class="pie-chart" src="./assets/icons/pie-chart.png" alt="pie-chart">
            <h1>Chinook Analytics Dashboard</h1>
        </div>
        <div class="filter-container">
            <div class="custom-select">
                <select>
                    <option value="" disabled selected>Date Range</option>
                    <option value="today">Today</option>
                    <option value="last-7-days">Last 7 days</option>
                </select>
            </div>

            <div class="custom-select">
                <select>
                    <option value="" disabled selected>Country</option>
                    <option value="us">United States</option>
                    <option value="es">Spain</option>
                    <option value="ar">Argentina</option>   
                </select>
            </div>

            <div class="custom-select">
                <select>
                    <option value="" disabled selected>Genre</option>
                    <option value="rock">Rock</option>
                    <option value="pop">Pop</option>
                    <option value="jazz">Jazz</option>
                </select>
            </div>
        </div>
    </header>
    <aside class="sidebar">
    <h1 class="sidebar-title">Chinook</h1>
    <nav class="sidebar-nav">
        <button data-view="overview" class="active">
        <i class="fa-solid fa-table-cells-large"></i> Overview
        </button>
        <button data-view="sales">
        <i class="fa-solid fa-chart-line"></i> Sales
        </button>
        <button data-view="music">
        <i class="fa-solid fa-music"></i> Music
        </button>
        <button data-view="customers">
        <i class="fa-solid fa-users"></i> Customers
        </button>
        <button data-view="geography">
        <i class="fa-solid fa-earth-americas"></i> Geography
        </button>
        <button data-view="employees">
        <i class="fa-solid fa-user-tie"></i> Employees
        </button>
    </nav>
    </aside>

    <main class="main">
      <header class="topbar">
        hello
      </header>

      <section class="content">
        <section class="view active" data-view="overview"></section>
        <section class="view" data-view="sales"></section>
        <section class="view" data-view="music"></section>
        <section class="view" data-view="customers"></section>
        <section class="view" data-view="geography"></section>
        <section class="view" data-view="employees"></section>
      </section>
    </main>

  </div>



    <!-- MAIN JS -->
    <script type="module" src="./js/main.js"></script>
    
    <!-- CHART JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.js"></script>
</body>
</html>
